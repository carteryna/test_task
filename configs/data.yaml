# Clip roles are the leakage firewall. Train/val come only from clips.train.
# The eval clip must not be used for training, threshold tuning, or model selection.

paths:
  videos_dir: train_val_data
  frames_dir: data/frames
  splits_dir: data/splits

sampling:
  train_fps: 2.0
  eval_fps: 5.0
  image_ext: jpg
  jpeg_quality: 95
  # Native resolution on disk. YOLO letterbox (imgsz 1280) happens at train/infer.

split:
  strategy: last_fraction_per_clip
  val_fraction: 0.20  # last 20% of EACH train clip, by time

# Single-class detector. Motorcycles are out of the ontology (cleanup + teacher).
class_name: vehicle
class_id: 0

# Teacher runs on train.txt + val.txt only. Eval labeling is a later script.
teacher:
  name: yolo_world
  weights: weights/yolov8s-worldv2.pt
  fallback_weights: yolo11s.pt
  # COCO: 2=car, 5=bus, 7=truck. ID 3 (motorcycle) removed — width prior is ~2.0 m.
  coco_vehicle_ids: [2, 5, 7]
  # Open-vocab prompts; motorcycle / bike omitted on purpose.
  prompts:
    - car
    - truck
    - bus
    - van
    - automobile
  conf: 0.15  # low on purpose: keep far/faint boxes; cleanup deletes FPs. No SAHI (CPU).
  iou: 0.5
  imgsz: 1280
  min_side_px: 8
  max_aspect: 8.0
  labels_dir: data/labels/raw
  summary_path: data/splits/label_summary.json
  preview_dir: results/auto_label

# Hold-out proxy GT. Same teacher, separate directory. Only after the student is frozen.
eval_gt:
  labels_dir: data/labels/eval
  backup_dir: data/labels/eval_raw   # teacher dump; heuristic+QA write back to labels_dir
  summary_path: data/splits/eval_label_summary.json
  preview_dir: results/auto_label_eval
  log_path: data/splits/eval_cleanup_log.json
  stats_path: data/splits/eval_dataset_statistics.json
  distance_report_path: data/splits/eval_distance_bands.json
  distance_boxes_csv: data/splits/eval_distance_boxes.csv

# Band metrics: conf/NMS chosen on val only, then one hold-out pass (eval never used for selection).
evaluation:
  weights: runs/train/yolo11n/weights/best.pt
  imgsz: 1280
  iou_match: 0.5
  nms_iou: 0.5
  # Predict once at predict_conf_floor; sweep conf_grid offline on val.
  predict_conf_floor: 0.01
  conf_grid: [0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]
  # Selection: mean of near/far F1 on val (far weight kept even if sparse).
  selection: mean_band_f1
  thresholds_path: data/splits/eval_thresholds.json
  metrics_path: data/splits/eval_metrics.json
  overlay_dir: results/eval_overlays
  overlay_max_per_clip: 4
  # Submission stills: side-by-side GT | preds + combined legend under outputs/examples/.
  examples_dir: outputs/examples
  examples_per_clip: 3

# Error taxonomy on hold-out FPs/FNs. Diagnostic only: nothing here re-tunes the model.
diagnostics:
  report_path: data/splits/error_taxonomy.json
  crops_dir: data/hard_negatives
  visuals_dir: outputs/diagnostics
  max_crops: 120
  crop_pad_px: 12
  # Lightweight ByteTrack-style IoU tracker (no extra deps; CPU-only stack).
  tracker:
    high_conf: 0.50      # first association stage
    iou_high: 0.30
    iou_low: 0.20        # second stage recovers weak boxes
    max_age: 3           # sampled frames a track may coast
  rules:
    gt_omission_conf: 0.50       # Rule 1: confident FP with no GT
    motorcycle_aspect: 3.0       # Rule 2: extreme aspect FP
    fracture_min_parts: 2        # Rule 3: FPs inside one missed GT
    fracture_containment: 0.60   # share of FP area inside the GT box
    fracture_large_pct: 75       # GT must be >= this area percentile in its clip
    static_move_px: 5.0          # Rule 4: centroid drift budget
    static_min_frames: 30        # consecutive sampled frames
    # Drone ego-motion makes the strict rule rare; relaxed pass only feeds mining.
    relaxed_move_frac: 0.01      # of image width
    relaxed_min_frames: 8

# Zero-human data factory: Grounding DINO boxes -> SAM masks -> tight boxes -> rules.
# Offline engine only (minutes per 4K frame on CPU); the Pi 5 still ships YOLO11n.
auto_label_dino_sam:
  labels_dir: data/labels/auto_generated
  summary_path: data/splits/auto_label_dino_sam.json
  preview_dir: results/auto_label_dino_sam
  cache_dir: runs/cache/dino_sam   # gitignored; lets rules be re-tuned without re-inference
  preview_per_clip: 2
  # Hold-out audit only, behind --allow-eval. A second opinion on the teacher's
  # proxy GT; never training data, and it does not overwrite data/labels/eval.
  eval:
    labels_dir: data/labels/eval_dino_sam
    summary_path: data/splits/auto_label_dino_sam_eval.json
    preview_dir: results/auto_label_dino_sam_eval
    reference_dir: data/labels/eval   # QA'd proxy GT that scored the student
  dino:
    model_id: IDEA-Research/grounding-dino-tiny
    prompt: "vehicle."      # HF grounding expects lowercase, period-terminated
    # Probe on A/C/D: 0.25 -> 44-71% recall vs cleaned labels, 0.15 -> 89-100%.
    # Kept deliberately low; SAM guards + schema + kinematics do the rejecting.
    box_threshold: 0.15
    text_threshold: 0.20
    batch_size: 2
  # DINO letterboxes to ~800 px, so far vehicles in a 4K frame vanish. Tile, then merge.
  tiling:
    rows: 2
    cols: 2
    overlap: 0.15           # fraction of tile side
    full_frame_pass: true   # recovers objects straddling tile seams
    merge_iou: 0.55         # class-agnostic NMS across tile + full-frame boxes
  sam:
    model_id: facebook/sam-vit-base
    box_pad_frac: 0.25      # mask search window around the DINO prompt box
    min_area_frac: 0.05     # refined/prompt area guards: below or above => keep DINO box
    max_area_frac: 3.0
    min_iou: 0.25           # refined vs prompt IoU floor
    boxes_per_chunk: 16
    contour_eps_frac: 0.01  # polygon simplification for previews
  schema:
    min_side_px: 8
    max_dim_frac: 0.35
    max_aspect: 6.0
    motorcycle_aspect: 3.0      # taxonomy Rule 2: elongated AND small => not in ontology
    motorcycle_max_side_px: 28
    merge_iou: 0.35             # articulated truck fragments (taxonomy Rule 3)
    merge_containment: 0.60
    merge_max_aspect: 6.0
    merge_max_growth: 1.6       # union / larger part; blocks merging neighbouring cars
    merge_min_aspect: 1.8       # trucks are elongated; square FP clusters stay split
    merge_min_side_px: 24       # and large: no merging of far specks
  # Taxonomy Rule 4 applied pre-training. Sampled at train_fps, so 12 frames ~ 6 s.
  kinematics:
    static_move_frac: 0.005   # centroid drift budget, fraction of image width
    static_min_frames: 12
    min_track_hits: 1         # >1 also purges single-frame flicker
    tracker:
      high_conf: 0.35
      iou_high: 0.30
      iou_low: 0.20
      max_age: 2

# Phase 3 distance bands: short side ≈ physical width (cars and long trucks share one prior).
# Dist = f_px * W_ref / s_px with f_px = H / (2 * tan(FOV_v/2))  (equiv. form of the FOV pinhole model).
distance:
  w_ref_m: 2.0
  size_side: min  # min(box_w, box_h) in pixels
  fov_v_deg: 40.0  # narrower FOV / zoom-like highway view; populates 200–400 m band
  near_max_m: 200.0
  far_max_m: 400.0
  exclude_classes_note: "Motorcycles excluded to preserve the 2.0m physical width prior"
  report_path: data/splits/distance_bands.json
  boxes_csv: data/splits/distance_boxes.csv

# Heuristic + interactive cleanup. Operates on train/val only; writes data/labels/clean.
cleanup:
  raw_dir: data/labels/raw
  clean_dir: data/labels/clean
  backup_dir: data/labels/raw_backup
  log_path: data/splits/cleanup_log.json
  min_dim: 0.005   # drop boxes < 0.5% of frame (normalized)
  max_dim: 0.35    # drop huge boxes
  max_aspect: 6.0  # stricter than teacher; kills poles/lines
  display_max_side: 1280

clips:
  train:
    - id: A
      pexels: "8968356"
      file: 8968356-hd_1920_1080_30fps.mp4
      scene: highway interchange
    - id: B
      pexels: "5382494"
      file: 5382494-uhd_3840_2160_24fps.mp4
      scene: rural highway
    - id: C
      pexels: "8457857"
      file: 8457857-uhd_3840_2160_24fps.mp4
      scene: top-down highway
    - id: D
      pexels: "3405804"
      file: 3405804-uhd_3840_2160_30fps.mp4
      scene: urban intersection
  eval:
    - id: E
      pexels: "13722965"
      # Brief listed Pexels 32179597; the local held-out file is 13722965.
      brief_pexels: "32179597"
      file: 13722965_2160_3840_30fps.mp4
      scene: city highway daytime (portrait)
    - id: F
      pexels: "14693572"
      file: 14693572_3840_2160_25fps.mp4
      scene: high aerial highway (landscape 4K; far-band hold-out extension)
